[pytest]
# `pythonpath = .` is not optional here.
#
# There are no __init__.py files anywhere in src/ — the project uses implicit
# namespace packages, and it is not installed as a package either (no
# pyproject.toml, no setup.py). Without this line `from src.core.config import
# settings` fails at collection with ModuleNotFoundError, and the failure looks
# like a broken test rather than a missing path entry.
pythonpath = .

testpaths = tests

# Quiet, but say which test is running when something fails.
addopts = -q --strict-markers

markers =
    db: needs a real Postgres. Skipped automatically when none is reachable.
    security: a boundary this product promises to hold. Read these first.
