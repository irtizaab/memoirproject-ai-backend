name: opencode

on:
  issue_comment:
    types: [created]

jobs:
  review:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/oc')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/deepseek-v4-flash-free
          use_github_token: true
          prompt: |
            Review this pull request.
            Check that routes stay thin, business logic sits in domain/,
            and external calls only happen in integrations/.
            Flag any database query not filtered by memoir_id.
            Flag bugs, missing error handling, and security issues.
